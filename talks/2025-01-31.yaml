title: "Automating a Complete Software Test Process Using LLMs: An Automotive Case Study"
abstract: |
  In this talk, I will present our work recently accepted by the International Conference on Software Engineering (ICSE). I will introduce an innovative system that leverages Large Language Models (LLMs) to automate vehicle API testing - a critical but complex
  process in Volvo. Vehicle APIs enable external applications to interact with various vehicle functions, but testing these APIs traditionally involves navigating through complex documentation, coordinating multiple systems, and managing intricate dependencies.
  Our research addresses the practical challenges faced in industrial settings, where testing is often hindered by inconsistent documentation and ambiguous specifications. By breaking down the testing process into well-defined segments, we've created a systematic
  approach that allows LLMs to handle specific testing tasks effectively. Our experiments, conducted across more than 100 APIs, demonstrate that LLMs can successfully automate tasks that typically require human judgment.
