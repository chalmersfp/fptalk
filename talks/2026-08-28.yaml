speaker: Liam Hughes
place: Analysen
date: 2026-08-28 11:00:00
title: "EVMC, a functional systems language for Ethereum"
abstract: |
  The Ethereum blockchain is the largest blockchain with Turing complete
  contracts. Ethereum contracts run on the EVM, an idiosyncratic VM adapted
  to smart contract execution.
  On-chain computation is extremely expensive, and correctness is of vital
  importance since contracts directly and irreversibly move money.
  The existing EVM language ecosystem leaves much to be
  desired: developers are limited to monomorphic type systems and locked into
  inefficient abstractions. They need new languages!
  In this talk I present EVMC, a C and Haskell-inspired language
  intended for development of new language environments on the EVM.
  I describe its design and show how one can make use of its low-level control
  and type system to develop higher-level abstractions such as closures,
  coroutines, and a typed interface to existing smart contracts.
  Finally I show how EVMC makes developing an interpreter easy, and outline
  my plan for using that to enable massive cost savings.
