speaker: "Niklas Deworetzki"
place: Analysen
online: https://chalmers.zoom.us/j/65345326464
date: 2025-10-03 11:00:00
title: "How to Train a LLM for Niche Query Languages - A Study on Grew"
abstract: |
  To make corpus search more accessible, Katya and I wanted to create an AI-powered system that would translate natural language descriptions into queries for the Grew query system.
  Unlike the impressive examples of AI writing software that make the round every now and then, we noticed two differences:
  (1) Grew as a query language is only rarely found in the wild & training sets and (2) our initial results were not quite as impressive.
  In this talk, I will present techniques to improve LLM output in this translation task and the challenges of generating a synthetic training set.
  
  This talk is about ongoing research conducted by Katya and me. We encourage you to voice your ideas and input throughout the presentation.
