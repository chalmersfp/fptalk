speaker: "Lawrence Chonavel"
place: Analysen
date: 2023-04-28 11:00:00
title: "The BUBS runtime"
abstract: |
  Is garbage collection getting to you?
  Are you stumped by STG?
  Is runtime complexity ruining your research?
  
  If so, come to Friday's FP talk, where I will present
  Shivers & Wand 's BUBS algorithm for λ-calculus reduction,
  which is simple, fast, lazy, garbage-free, and supports open terms.
