speaker: "[Troels Henriksen](https://hjemmesider.diku.dk/~athas/)"
place: Analysen
date: 2025-04-25 11:00:00
title: "Data Parallel Automatic Differentiation"
abstract: |
  Automatic Differentiation is a program transformation for
  taking derivatives of arbitrary programs. Apart from being fashionable
  due to its use in machine learning, it is also pretty fun from a
  language design and implementation perspective. I will describe our work
  on applying automatic differentiation to a somewhat flexible data
  parallel functional array language, Futhark, which supports nested
  parallelism and arbitrary array indexing - two features that add
  particular challenges and more fun, in particular by requiring somewhat
  unusual programming constructs that go beyond what you would normally
  find in the intermediate representation of a compiler for a purely
  functional language.
