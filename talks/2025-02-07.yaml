speaker: "Carl-Johan Seger"
place: Analysen
online: https://chalmers.zoom.us/j/69606989059
date: 2025-02-07 11:00:00
title: "Symbolic Techniques for Fun and Profit"
abstract: |
  Symbolic techniques using BDDs and SAT solvers have proven indispensable in formal verification of hardware. In this joint work with Henrik, we expand their uses by combining the symbolic methods with signal probabilities. We will illustrate how this combination
  can be used for power estimation of circuits as well as for more traditional simulation. More specifically, we will show how one can go from uniform input distribution to uniform distribution when some input constraints must be satisfied. We then also show
  how non-uniform distributions can be handled. We finally show how some generalization of these techniques can be used in other contexts by illustrating a novel approach for representing vectors and matrices symbolically and how matrix multiplication and other
  matrix operations can be done on such symbolic representations. The talk should does not assume any background in formal methods and will (hopefully) be understandable for everyone.
