title: "Faking sum types in GF"
abstract: |
  Grammatical Framework (GF) is a framework for building multilingual grammar applications. It is based on the idea of a shared abstract syntax and mappings between the abstract syntax and concrete languages. GF's main components are a functional programming language and a resource library that contains the linguistic details of many natural languages.
  
  Sometimes we need to represent data that can take one of mutually exclusive forms. However, GF doesn't support disjoint unions as linearization categories in the concrete syntax. The usual workaround is to use a record containing all possible fields with a flag to indicate which of the variants is active, all the while lamenting the ugliness and suggesting that GF introduce sigma types. I'm no type theorist, so in this talk, I present some down-to-earth improvements to this pattern:
  - Separate record types for each variant, combined into a single union type
  - Helper functions accept only the relevant variant type
  - Top-level functions handle dispatch logic only
  
  I demonstrate these techniques with before-and-after examples from the English resource grammar.
