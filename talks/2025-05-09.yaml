speaker: "Patrik Jansson"
place: Analysen
date: 2025-05-09 11:00:00
title: "adgA ni snoitatumrep etiniF | Finite permutations in Agda"
abstract: |
  Finite permutations are commonly used in mathematics and computing.
  We explain, specify and implement some common operations on
  permutations in Agda: identity, composition, inverse, etc. and
  note the connection to algebra and number systems.
