speaker: "Aarne Ranta"
place: Analysen
date: 2024-12-06 11:00:00
title: "Informath: autoformalization and informalization for formal mathematics"
abstract: |
  Recent advances of AI in mathematics, such as AlphaProof's solutions of Mathematics Olympiad problems, combine large language models, which suggest solutions, with formal proof systems, which verify them. Conversion between formal and informal mathematical
  language is an essential part of this process. In AlphaProof, it is performed manually. The project Informath addresses this problem and, more generally, conversions between formal and informal languages of mathematics. This talk reports preliminary results
  of building an automatic formalization system by combining grammar rules and data-driven parsing, and using Wikidata as a source of mathematical terminology. Most of the work was done within the trimester program "Prospects of Formal Mathematics" at Hausdorff
  Research Institute for Mathematics in Bonn in Summer 2024.
