date: 2025-05-02 11:00:00
title: "An image system for a microntroller Lisp"
abstract: |
  Some lisp implementations allow a programming style called image-based development. In this style the programmer issues defintions through the REPL until happy with the state that builds up in the runtime system. The programmer then "saves" the image and has thus created a distributable "executable". Image based development is a playful and fun way to develop.
  This talk is about an image system for a microntroller lisp. The purpose of this image system is not to allow the playful image-based development methodology (but perhaps to a small degree it does), but rather it is mainly a way to make boot-up time of a system faster! The image system we implement has to work around a bunch of limitations, for example we are running programs that does not fit in the RAM heap and that there is no way to store an "extra" copy of the entire runtime system state in any non-volatile storage between reboots.
