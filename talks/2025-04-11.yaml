speaker: "John Camilleri"
place: Analysen
date: 2025-04-11 11:00:00
title: "Lecture attendance ain't what it used to be."
abstract: |
  Post-pandemic, our lecture halls are noticeably emptier — not just at this department, but worldwide. Why is this?
  Streaming lectures and uploading recordings of them is the obvious culprit, but I think that the way we design our lecture materials for easy distribution and re-use is also largely to blame. We can no longer get away with simply putting together a slide deck and using the lecture to narrate it. Students value flexibility more than before, and the cost-benefit ratio of attending lectures is often not convincing enough anymore.
  In this talk, I — a blatantly naive newly-recruited lecturer — will talk about some things which I think we can do to fix this. But mostly it will be a collegial discussion about lecture attendance in our courses and what we are doing about it (if anyone shows up, that is).
