<article class="talk-row">
<time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
  {{ .Date.Format "2 January 2006" }}
</time>

<div>
  <h3>
    <a href="{{ .RelPermalink }}">{{ .Title | markdownify }}</a>
  </h3>

  {{ with .Params.speaker }}
    <p>{{ . | markdownify }}</p>
  {{ end }}
</div>
</article>
